<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Message</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--ff:"Helvetica Neue",Helvetica,Arial,sans-serif;--bg:#fff;--ink:#222;--dim:#a0a0a0;--line:#eee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--ink:#e6e6e6;--dim:#777;--line:#262626}}
:root[data-theme="dark"]{--bg:#151515;--ink:#e6e6e6;--dim:#777;--line:#262626}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:13px/1.75 var(--ff);font-size:calc(13px*var(--s,1));-webkit-font-smoothing:antialiased;text-transform:lowercase;letter-spacing:.02em;min-height:100vh}
.text,.rep,.m,textarea,.in,.row span,.chat span,.prof p{text-transform:none;letter-spacing:0}
a{color:inherit;text-decoration:none}
.at{border-bottom:1px solid var(--dim)}
#acl{position:fixed;z-index:7;background:var(--bg);border:1px solid var(--line);min-width:200px;max-width:calc(100vw - 24px);padding:6px 0}
#acl button{display:flex;justify-content:space-between;gap:24px;width:100%;text-align:left;padding:7px 18px;color:var(--dim)}
#acl button.on{color:var(--ink)}#acl em{font-style:normal;color:var(--dim)}
.set button{display:block;padding:8px 0}.set{margin-top:22px;margin-bottom:8px}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;text-transform:inherit;letter-spacing:inherit}
button{cursor:pointer}
textarea,.in{text-transform:none;letter-spacing:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:22px 24px}
.burger{position:relative;padding:8px 0 8px 14px}
.burger i{display:block;width:18px;height:1px;background:var(--ink);margin:5px 0}
.burger.dot::after{content:"";position:absolute;top:6px;right:-6px;width:5px;height:5px;background:var(--ink);border-radius:50%}
.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 52px);right:20px;background:var(--bg);border:1px solid var(--line);min-width:170px;padding:8px 0;z-index:5}
.panel a,.panel button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:7px 20px}
.panel em{font-style:normal;color:var(--dim)}
main{max-width:440px;margin:0 auto;padding:12vh 24px 20vh}
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22vh 24px 0}
.gate form{width:100%;max-width:240px}.gate .in{text-align:center}
.gate p{color:var(--dim);margin:8px 0 32px}
.in{display:block;width:100%;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:22px;font-size:calc(14px*var(--s,1))}
.in:focus{border-color:var(--ink)}
.in:focus-visible{outline:none}
textarea::placeholder,.in::placeholder{color:var(--dim)}
.go{border-bottom:1px solid var(--ink)}
.go:disabled{color:var(--dim);border-color:var(--line);cursor:default}
.dim,.bar button,.acts button,.sortrow button,.thread>button{color:var(--dim)}
.bar button:hover,.acts button:hover,.acts button.on,.sortrow button:hover,.thread>button:hover{color:var(--ink)}
.toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;color:var(--dim);z-index:6}
.err{color:var(--dim);min-height:22px;margin-bottom:8px}
.compose{margin-bottom:64px}
textarea{width:100%;min-height:44px;resize:none;font-size:calc(14px*var(--s,1));line-height:1.6}
.bar{display:flex;gap:22px;margin-top:10px;align-items:center}
#post{margin-left:auto}
.sortrow{display:flex;gap:22px;margin-bottom:56px}.sortrow button.on{color:var(--ink)}
.who button{color:var(--dim)}.who button:hover{color:var(--ink)}
.post{margin-bottom:56px;cursor:pointer}.post input{cursor:text}
.zoom .text{font-size:calc(18px*var(--s,1));line-height:1.5;margin:10px 0 14px}.zoom .acts span{padding:8px 0}.zoom .thread{padding-left:0;margin-top:28px}
.who{display:flex;align-items:center;gap:12px;color:var(--dim)}.who a{color:var(--ink)}
.text{font-size:calc(14px*var(--s,1));margin:4px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.img{display:block;max-width:100%;max-height:80vh;margin:10px 0 12px;object-fit:contain}
.thumb{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;margin:10px 0 12px;background:var(--line)}
.acts{display:flex;gap:26px}.acts button{padding:8px 0}
.rbar{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.rbar button:first-child{color:var(--dim)}
.thread{margin-top:18px;padding-left:18px}
.rep{margin-bottom:14px}
.thread .in{margin:0 0 14px}
.info{color:var(--dim);margin-top:6px}
.prof{margin-bottom:56px}.prof h2{font-size:calc(13px*var(--s,1));font-weight:400}.prof p{color:var(--dim)}.prof .go{display:inline-block;margin-top:14px}
.sec{color:var(--dim);margin:40px 0 16px}
.row{display:block;margin-bottom:18px}.row b{font-weight:400}.row span,.row em{color:var(--dim);margin-left:12px;font-style:normal}
.msgs{display:flex;flex-direction:column;margin:0 0 36px}
.day{align-self:center;color:var(--dim);margin:8px 0 26px}
.g{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:26px}.g.me{align-items:flex-end}
.g .n{color:var(--dim);margin-bottom:7px}.g .n i{font-style:normal;margin-left:10px}.g:not(.me) .n b{color:var(--ink);font-weight:400}
.g .m{max-width:84%;padding:11px 15px;margin-bottom:4px;border:1px solid var(--line);font-size:calc(14px*var(--s,1));white-space:pre-wrap;overflow-wrap:anywhere}
.g.me .m{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chat{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:15px 0;border-bottom:1px solid var(--line)}
.chat div{min-width:0}.chat b{display:block;font-weight:400}
.chat span{display:block;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat em{font-style:normal;color:var(--dim);white-space:nowrap}
.empty{color:var(--dim)}
h1.page{font-size:calc(13px*var(--s,1));font-weight:400;color:var(--dim);margin:0 0 40px}
label.l{display:block;color:var(--dim)}
html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}
@media (pointer:coarse){input,textarea{font-size:max(16px,calc(16px*var(--s,1)))!important}.acts button,.sortrow button,.bar button,.rbar button,.who button{padding-top:10px;padding-bottom:10px}.panel a,.panel button{padding-top:12px;padding-bottom:12px}}
@media (max-width:480px){main{padding:9vh 22px 24vh}}
</style>
</head>
<body>
<div id="app"></div>
<div id="acl" hidden role="listbox" aria-label="people"></div>
<script>
const $=i=>document.getElementById(i),app=$("app");
let db=null,user=null,assets=null,me=null,S=null,ready=false,got={},rp=[],rl=[],rr=[],rd=[],rq=[],profs={},drafts={},tab="new",menu=false,err="",toast="",busy=false,remote=false,local=false,mode="signup",started=false,nseen=0,seen=0;const rnd={};
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const TAGS=["post it once. it stays.","follow someone new today.","your connections are waiting.","say something worth a like.","see what is trending.","leave a comment on something.","share a photo. keep it simple.","nobody is performing. just post.","find your connections.","start a thread.","like what you mean.","someone posted while you were gone.","your feed, in your order.","reply to the last thing you read.","see who is posting right now."];
const pickTag=()=>{const last=store("lasttag")||"",o=TAGS.filter(t=>t!==last),t=o[Math.floor(Math.random()*o.length)];store("lasttag",t);return t};let tag=pickTag();
const FS={small:.9,medium:1,large:1.15,"extra large":1.3},FF={sans:'"Helvetica Neue",Helvetica,Arial,sans-serif',serif:'Georgia,"Times New Roman",serif',mono:'ui-monospace,Menlo,Consolas,monospace'};
const look=()=>{const r=document.documentElement;r.style.setProperty("--s",FS[store("fs")]||1);r.style.setProperty("--ff",FF[store("ff")]||FF.sans);};look();
const theme=m=>{const r=document.documentElement;if(m==="light"||m==="dark")r.dataset.theme=m;else delete r.dataset.theme};theme(store("theme"));
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"};
const kb=n=>n>1048576?(n/1048576).toFixed(1)+"mb":Math.round(n/1024)+"kb";
const loggedOut=()=>!remote&&!local&&store("out")==="1";
const blobSrc=id=>(remote?"/img/":"/_blob/")+esc(id);
const av=()=>"";
const route=()=>{const p=(location.hash||"#/").slice(2).split("/");let a=p[1]||"";try{a=decodeURIComponent(a)}catch(e){}return{n:p[0]||"feed",a}};
const userOf=h=>S.users.find(u=>u.handle===h);
function toks(t){t=String(t==null?"":t);const o=[],re=/@([a-z0-9._]{2,20})/gi;let i=0,m;
  while((m=re.exec(t))){let h=m[1].toLowerCase();while(h.length>=2&&!userOf(h)&&/[._]$/.test(h))h=h.slice(0,-1);if(!userOf(h))continue;
    const end=m.index+1+h.length;if(m.index>i)o.push({t:t.slice(i,m.index)});o.push({h});i=end;re.lastIndex=end}
  if(i<t.length)o.push({t:t.slice(i)});return o}
const rich=t=>toks(t).map(x=>x.h?`<a class="at" href="#/u/${esc(x.h)}">@${esc(x.h)}</a>`:esc(x.t)).join("");
const ments=t=>new Set(toks(t).filter(x=>x.h).map(x=>x.h));
const likesOf=id=>S.likes.filter(l=>l.post===id);
const repsOf=id=>S.replies.filter(r=>r.post===id).sort((a,b)=>a.ts-b.ts);
const convo=k=>S.dms.filter(d=>d.from===k||d.to===k).sort((a,b)=>a.ts-b.ts);
function build(){
  const H={},R={};Object.keys(profs).forEach(k=>{if(profs[k].handle){H[k]=profs[k].handle;R[profs[k].handle]=k}});
  const h=k=>H[k]||"someone";
  S={me:H[me],R,users:Object.keys(H).map(k=>({handle:H[k],bio:profs[k].bio||""})),
    posts:rp.map(p=>({...p,by:h(p.by)})),likes:rl.map(l=>({...l,by:h(l.by)})),replies:rr.map(r=>({...r,by:h(r.by)})),
    reqs:rq.map(r=>({...r,from:h(r.from),to:h(r.to)})),
    dms:rd.filter(d=>d.from===me||d.to===me).map(d=>({...d,from:h(d.from),to:h(d.to)}))};
}
function conn(k){const r=S.reqs.find(r=>(r.from===S.me&&r.to===k)||(r.from===k&&r.to===S.me));return r||(convo(k).length?{status:"accepted",legacy:1}:null)}
function notifs(){const mine=new Set(S.posts.filter(p=>p.by===S.me).map(p=>p.id)),n=[];
  S.likes.forEach(l=>{if(mine.has(l.post)&&l.by!==S.me)n.push({ts:l.ts||1,t:`@${l.by} liked your post`,href:"#/p/"+l.post})});
  S.replies.forEach(r=>{if(mine.has(r.post)&&r.by!==S.me)n.push({ts:r.ts,t:`@${r.by} commented: ${r.text.slice(0,60)}`,href:"#/p/"+r.post})});
  S.posts.forEach(p=>{if(p.by!==S.me&&p.text&&ments(p.text).has(S.me))n.push({ts:p.ts,t:`@${p.by} mentioned you in a post`,href:"#/p/"+p.id})});
  S.replies.forEach(r=>{if(r.by!==S.me&&!mine.has(r.post)&&ments(r.text).has(S.me))n.push({ts:r.ts,t:`@${r.by} mentioned you in a comment`,href:"#/p/"+r.post})});
  S.dms.forEach(d=>{if(d.to===S.me)n.push({ts:d.ts,t:`@${d.from} sent you a message`,href:"#/m/"+d.from})});
  S.reqs.forEach(r=>{if(r.to===S.me&&r.status==="pending")n.push({ts:r.ts,t:`@${r.from} wants to message you`,href:"#/m/"+r.from});if(r.from===S.me&&r.status==="accepted")n.push({ts:r.ats||r.ts,t:`@${r.to} accepted your message request`,href:"#/m/"+r.to})});
  return n.sort((a,b)=>b.ts-a.ts).slice(0,60)}
function score(h){const mine=S.posts.filter(p=>p.by===h);return mine.length+2*mine.reduce((n,p)=>n+likesOf(p.id).length,0)}
function shell(b){const u=notifs().filter(n=>n.ts>seen).length;
  app.innerHTML=`<header><a class="brand" href="#/">the message</a><button id="mn" class="burger${u?" dot":""}" aria-label="menu" aria-expanded="${menu}"><i></i><i></i><i></i></button></header>`+
  (menu?`<div class="panel"><a href="#/">feed</a><a href="#/messages">messages</a><a href="#/notifs">notifications${u?`<em>${u}</em>`:""}</a><a href="#/liked">liked</a><a href="#/u/${esc(S.me)}">my profile</a><a href="#/settings">settings</a><button id="out">log out</button></div>`:"")+`<main>${b}</main>`+(toast?`<div class="toast" role="status">${esc(toast)}</div>`:"")}
function auth(){const has=!!profs[me];
  app.innerHTML=`<div class="gate"><h1>the message</h1><p>${esc(tag)}</p>`+(has?`<button class="go" id="login">log in</button>`:
  `<form id="af"><input class="in" id="h" placeholder="choose a handle" maxlength="20" autocapitalize="none" spellcheck="false" aria-label="handle" value="${esc(drafts.h||"")}"><div class="err">${esc(err||"letters, numbers, dots or underscores")}</div><button class="go" ${busy?"disabled":""}>create account</button></form>`)+`</div>`}
function postHTML(p){const lk=likesOf(p.id),rs=repsOf(p.id),o=drafts["o"+p.id],src=p.img?blobSrc(p.img):p.imgData?esc(p.imgData):"";
  return `<article class="post" data-id="${esc(p.id)}">${av(p.by)}<div><div class="who"><a href="#/u/${esc(p.by)}">@${esc(p.by)}</a>${ago(p.ts)}</div>${p.text?`<div class="text">${rich(p.text)}</div>`:""}${src?`<img class="thumb" loading="lazy" alt="image in post" src="${src}">`:""}
  <div class="acts"><button data-a="c" data-i="${esc(p.id)}" class="${o?"on":""}">comment ${rs.length}</button><button data-a="l" data-i="${esc(p.id)}" class="${lk.some(l=>l.by===S.me)?"on":""}">${lk.some(l=>l.by===S.me)?"liked":"like"} ${lk.length}</button>${p.by===S.me?`<button data-a="d" data-i="${esc(p.id)}">${drafts["c"+p.id]?"sure?":"delete"}</button>`:""}</div>
  ${o?`<div class="thread">${rs.length?"":`<div class="rep dim">no comments yet</div>`}${rs.map(r=>`<div class="rep"><div class="who"><a href="#/u/${esc(r.by)}">@${esc(r.by)}</a>${ago(r.ts)}${r.by===S.me&&!String(r.id).startsWith("tmp")?`<button data-a="dr" data-i="${esc(r.id)}">${drafts["c"+r.id]?"sure?":"delete"}</button>`:""}</div>${rich(r.text)}</div>`).join("")}<input class="in" id="r-${esc(p.id)}" data-p="${esc(p.id)}" maxlength="280" placeholder="write a comment" aria-label="write a comment" value="${esc(drafts["r"+p.id]||"")}"><div class="rbar"><span></span><button class="go" data-a="rs" data-i="${esc(p.id)}">send</button></div></div>`:""}</div></article>`}
function feed(){const d=drafts;let l=S.posts.slice();
  if(tab==="old")l.sort((a,b)=>a.ts-b.ts);
  else if(tab==="trending")l.sort((a,b)=>(likesOf(b.id).length+2*repsOf(b.id).length)-(likesOf(a.id).length+2*repsOf(a.id).length)||b.ts-a.ts);
  else if(tab==="liked"){const t=new Map();S.likes.forEach(l=>{if(l.by===S.me)t.set(l.post,l.ts||0)});l=l.filter(p=>t.has(p.id)).sort((a,b)=>t.get(b.id)-t.get(a.id))}
  else l.sort((a,b)=>b.ts-a.ts);
  shell(`<section class="compose"><textarea id="t" maxlength="280" rows="2" placeholder="say something" aria-label="write a post">${esc(d.t||"")}</textarea>${d.url?`<img class="thumb" src="${d.url}" alt="attached image">`:""}${d.info?`<div class="info">${esc(d.info)}</div>`:""}
  <div class="bar"><input type="file" id="f" accept="image/*" hidden><button data-a="pick">${d.blob?"change image":"image"}</button>${d.blob?`<button data-a="rm">remove</button>`:""}${busy?`<span class="dim">posting</span>`:""}<button class="go" id="post" ${((d.t||"").trim()||d.blob)&&!busy?"":"disabled"}>send</button></div></section>
  <div class="sortrow"><button class="on" data-a="sort" aria-label="change sort, now showing ${tab}">${tab}</button></div>`+(l.length?l.map(postHTML).join(""):`<p class="empty">${tab==="liked"?"nothing liked yet. tap like on a post to keep it here.":"nothing here yet"}</p>`))}
function profile(h){const u=userOf(h);if(!u)return shell(`<p class="empty">no one has that handle</p>`);
  const ps=S.posts.filter(p=>p.by===h).sort((a,b)=>b.ts-a.ts),lk=ps.reduce((n,p)=>n+likesOf(p.id).length,0);
  shell(`<section class="prof">${av(h,"lg",1)}<div><h2>@${esc(h)}</h2><p>${esc(u.bio||"no bio yet")}</p><p>${ps.length} posts, ${lk} likes</p>${h===S.me?`<a class="go" href="#/settings">edit profile</a>`:`<a class="go" href="#/m/${esc(h)}">message</a>`}</div></section>`+(ps.length?ps.map(postHTML).join(""):`<p class="empty">no posts yet</p>`))}
function postView(id){const x=S.posts.find(p=>p.id===id);
  if(!x)return shell(`<button class="dim" data-a="back">back</button><p class="empty">that post is gone</p>`);
  const lk=likesOf(id),rs=repsOf(id).reverse(),liked=lk.some(l=>l.by===S.me),src=x.img?blobSrc(x.img):x.imgData?esc(x.imgData):"";
  const when=new Date(x.ts).toLocaleString([],{hour:"numeric",minute:"2-digit",day:"numeric",month:"short"});
  shell(`<button class="dim" data-a="back">back</button><article class="zoom"><div class="who" style="margin-top:36px"><a href="#/u/${esc(x.by)}">@${esc(x.by)}</a>${esc(when)}</div>${x.text?`<div class="text">${rich(x.text)}</div>`:""}${src?`<img class="img" alt="image in post" src="${src}">`:""}
  <div class="acts"><button data-a="l" data-i="${esc(id)}" class="${liked?"on":""}">${liked?"liked":"like"} ${lk.length}</button><span class="dim">comments ${rs.length}</span>${x.by===S.me?`<button data-a="d" data-i="${esc(id)}">${drafts["c"+id]?"sure?":"delete"}</button>`:""}</div>
  <div class="thread"><input class="in" id="r-${esc(id)}" data-p="${esc(id)}" maxlength="280" placeholder="write a comment" aria-label="write a comment" value="${esc(drafts["r"+id]||"")}"><div class="rbar"><span></span><button class="go" data-a="rs" data-i="${esc(id)}">send</button></div>
  ${rs.map(r=>`<div class="rep"><div class="who"><a href="#/u/${esc(r.by)}">@${esc(r.by)}</a>${ago(r.ts)}${r.by===S.me&&!String(r.id).startsWith("tmp")?`<button data-a="dr" data-i="${esc(r.id)}">${drafts["c"+r.id]?"sure?":"delete"}</button>`:""}</div>${rich(r.text)}</div>`).join("")}</div></article>`)}
function messages(){
  const pend=S.reqs.filter(r=>r.to===S.me&&r.status==="pending").sort((a,b)=>b.ts-a.ts);
  const chats=[];S.users.forEach(u=>{if(u.handle===S.me)return;const c=conn(u.handle);if(!c)return;
    if(c.status==="accepted"){const l=convo(u.handle).pop();chats.push({u,ts:l?l.ts:(c.ats||c.ts||0),sub:l?(l.from===S.me?"you: ":"")+l.text.slice(0,50):"say hi"})}
    else if(c.status==="pending"&&c.from===S.me)chats.push({u,ts:c.ts,sub:"request sent"})});
  chats.sort((a,b)=>b.ts-a.ts);
  const used=new Set(S.users.filter(u=>u.handle!==S.me&&conn(u.handle)).map(u=>u.handle));
  const rec=S.users.filter(u=>u.handle!==S.me&&!used.has(u.handle)).map(u=>({u,s:score(u.handle)+(rnd[u.handle]=rnd[u.handle]??Math.random()*3)})).sort((a,b)=>b.s-a.s).slice(0,8);
  const row=(u,sub,t)=>`<a class="chat" href="#/m/${esc(u.handle)}"><div><b>@${esc(u.handle)}</b><span>${esc(sub)}</span></div>${t?`<em>${t}</em>`:""}</a>`;

  if(t.dataset.p)sendReply(t.dataset.p);
  if(t.id==="m"){const h=route().a,to=S.R[h];if(!to)return;const c=conn(h),ts=Date.now();drafts["m"+h]="";
    if(!c){const r={from:me,to,text:v,status:"pending",ts},id=me+"_"+to;rq.push({...r,id});render();db.doc("dmreq/"+id).set(r).catch(e=>{rq=rq.filter(x=>x.id!==id);fail(e)})}
    else if(c.status==="accepted"){const m={id:"tmp"+ts,from:me,to,text:v,ts};rd.push(m);render();db.collection("dms").add({from:me,to,text:v,ts}).catch(e=>{rd=rd.filter(x=>x!==m);fail(e)})}}});
addEventListener("hashchange",()=>{menu=false;scrollTo(0,0);if(S&&S.me&&route().n==="notifs"){nseen=+store("seen:"+me)||0;store("seen:"+me,String(Date.now()))}render()});
function localDb(){
  let cols={};try{cols=JSON.parse(store("tm_db")||"{}")}catch(e){}
  const subs=[],save=()=>store("tm_db",JSON.stringify(cols)),col=n=>cols[n]||(cols[n]={}),clone=o=>JSON.parse(JSON.stringify(o));
  const snap=(n,ord)=>{const docs=Object.keys(col(n)).map(id=>({id,data:()=>clone(col(n)[id])}));if(ord)docs.sort((a,b)=>ord.dir==="desc"?b.data()[ord.f]-a.data()[ord.f]:a.data()[ord.f]-b.data()[ord.f]);return{docs}};
  const fire=n=>subs.filter(s=>s.n===n).forEach(s=>setTimeout(()=>s.fn(snap(n,s.ord)),0));
  const doc=path=>{const i=path.indexOf("/"),c=path.slice(0,i),id=path.slice(i+1);return{async get(){return{exists:id in col(c),data:()=>clone(col(c)[id]||{})}},async set(d){col(c)[id]=clone(d);save();fire(c)},async delete(){delete col(c)[id];save();fire(c)}}};
  const collection=n=>{const q={ord:null,orderBy(f,dir){q.ord={f,dir};return q},limit(){return q},onSnapshot(fn){subs.push({n,fn,ord:q.ord});setTimeout(()=>fn(snap(n,q.ord)),0);return()=>{}},async add(d){const id=Math.random().toString(36).slice(2,12);col(n)[id]=clone(d);save();fire(n);return{id}},doc:id=>doc(n+"/"+id)};return q};
  return{collection,doc};
}
function remoteDb(){
  const subs=[],last={};
  const call=(m,p,b)=>fetch("/api/"+p,{method:m,headers:b!==undefined?{"Content-Type":"application/json"}:{},body:b!==undefined?JSON.stringify(b):undefined,credentials:"same-origin"}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||"request failed");e.code=r.status;throw e}return j});
  const snap=(docs,ord)=>{docs=docs.map(d=>({id:d.id,data:()=>({...d.data})}));if(ord)docs.sort((a,b)=>{const x=a.data()[ord.f]||0,y=b.data()[ord.f]||0;return ord.dir==="desc"?y-x:x-y});return{docs}};
  const poll=async n=>{try{const j=await call("GET","c/"+n),k=JSON.stringify(j.docs);if(k===last[n])return;last[n]=k;subs.filter(s=>s.n===n).forEach(s=>s.fn(snap(j.docs,s.ord)))}catch(e){}};
  setInterval(()=>{if(!document.hidden)[...new Set(subs.map(s=>s.n))].forEach(poll)},3000);
  const doc=path=>{const i=path.indexOf("/"),c=path.slice(0,i),id=path.slice(i+1);return{async get(){const j=await call("GET","d/"+c+"/"+id);return{exists:j.exists,data:()=>j.data||{}}},async set(d){await call("PUT","d/"+c+"/"+id,d);poll(c)},async delete(){await call("DELETE","d/"+c+"/"+id,{});poll(c)}}};
  const collection=n=>{const q={ord:null,orderBy(f,dir){q.ord={f,dir};return q},limit(){return q},onSnapshot(fn){subs.push({n,fn,ord:q.ord});last[n]=null;poll(n);return()=>{}},async add(d){const j=await call("POST","c/"+n,d);poll(n);return{id:j.id}},doc:id=>doc(n+"/"+id)};return q};
  return{collection,doc};
}
const remoteAssets=()=>({async upload(blob){const r=await fetch("/api/upload",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:blob,credentials:"same-origin"}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"upload failed");return{id:j.id}}});
let timer=null;const later=()=>{clearTimeout(timer);timer=setTimeout(()=>render(true),60)};
const rows=s=>s.docs.map(d=>({...d.data(),id:d.id}));
function start(){if(started)return;started=true;
  db.collection("posts").orderBy("ts","desc").limit(200).onSnapshot(s=>{rp=rows(s);got.p=1;later()});
  db.collection("replies").limit(1000).onSnapshot(s=>{rr=rows(s);later()});
  db.collection("dmreq").limit(1000).onSnapshot(s=>{rq=rows(s);later()});
  db.collection("dms").limit(2000).onSnapshot(s=>{rd=rows(s);later()});
  db.collection("likes").limit(2000).onSnapshot(s=>{rl=rows(s);later()});
  db.collection("profiles").limit(500).onSnapshot(s=>{profs={};s.docs.forEach(d=>{profs[d.id]=d.data()});got.f=1;later()});
}
(async()=>{
  try{user=await claude.use("user");db=await claude.use("db");assets=await claude.use("assets")}catch(e){}
  if(user&&db){try{me=await user.id()}catch(e){}}
